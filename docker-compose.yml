services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vulnora
      POSTGRES_USER: vulnora
      POSTGRES_PASSWORD: vulnora-local-only
    ports:
      - "5432:5432"
    volumes:
      - vulnora-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  vulnora-postgres:
